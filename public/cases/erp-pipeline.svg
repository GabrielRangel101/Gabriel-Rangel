<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 500" width="1220" height="500"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
     role="img" aria-label="Fluxo do pipeline: do ERP de origem para staging, camada tratada, estrela e conferencia">
  <title>Pipeline de integracao com ERP de varejo</title>
  <desc>O ERP de origem e lido por COPY com usuario somente leitura. Os dados passam por staging (copia crua),
  camada tratada (validada) e viram a estrela. Linha recusada vai para a quarentena e e relida a cada carga.
  A conferencia compara origem com estrela mais quarentena, por dia e loja, em contagem e em valor: se fecha,
  a marca-d'agua avanca; se nao fecha, a carga falha com codigo 1 e a marca fica parada.</desc>

  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="setaVerde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="setaVermelha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="setaClara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1220" height="500" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <rect x="236" y="92" width="576" height="312" rx="12" fill="#ffffff" stroke="#cbd5e1"
        stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="252" y="116" font-size="14" font-weight="600" fill="#64748b">dw_varejo</text>

  <rect x="24" y="104" width="178" height="104" rx="10" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="113" y="134" font-size="16" font-weight="700" fill="#9a3412" text-anchor="middle">erp_origem</text>
  <text x="113" y="157" font-size="12.5" fill="#7c2d12" text-anchor="middle">8 tabelas do ERP</text>
  <text x="113" y="176" font-size="12.5" fill="#7c2d12" text-anchor="middle">sem FK, quase sem</text>
  <text x="113" y="194" font-size="12.5" fill="#7c2d12" text-anchor="middle">NOT NULL, dt_alt por trigger</text>

  <rect x="256" y="128" width="152" height="94" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="332" y="156" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">stg</text>
  <text x="332" y="177" font-size="12" fill="#475569" text-anchor="middle">copia crua</text>
  <text x="332" y="194" font-size="12" fill="#475569" text-anchor="middle">nomes canonicos</text>
  <text x="332" y="211" font-size="12" fill="#475569" text-anchor="middle">persistente</text>

  <rect x="448" y="128" width="152" height="94" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="524" y="160" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">trt</text>
  <text x="524" y="183" font-size="12" fill="#475569" text-anchor="middle">validada</text>
  <text x="524" y="201" font-size="12" fill="#475569" text-anchor="middle">e tipada</text>

  <rect x="640" y="128" width="152" height="94" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="716" y="156" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">dw</text>
  <text x="716" y="177" font-size="12" fill="#475569" text-anchor="middle">estrela</text>
  <text x="716" y="194" font-size="12" fill="#475569" text-anchor="middle">2 fatos</text>
  <text x="716" y="211" font-size="12" fill="#475569" text-anchor="middle">3 dimensoes</text>

  <rect x="448" y="286" width="152" height="84" rx="10" fill="#fef2f2" stroke="#f87171" stroke-width="1.8"/>
  <text x="524" y="313" font-size="14" font-weight="700" fill="#991b1b" text-anchor="middle">quarentena</text>
  <text x="524" y="333" font-size="12" fill="#b91c1c" text-anchor="middle">linha recusada</text>
  <text x="524" y="350" font-size="12" fill="#b91c1c" text-anchor="middle">+ motivo</text>

  <rect x="256" y="286" width="152" height="84" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="332" y="313" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">ctl</text>
  <text x="332" y="333" font-size="12" fill="#475569" text-anchor="middle">execucao, etapas</text>
  <text x="332" y="350" font-size="12" fill="#475569" text-anchor="middle">marca-d'agua</text>

  <rect x="838" y="112" width="200" height="132" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.4"/>
  <text x="938" y="140" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">conferencia</text>
  <text x="938" y="165" font-size="12.5" font-weight="600" fill="#1d4ed8" text-anchor="middle">origem =</text>
  <text x="938" y="182" font-size="12.5" font-weight="600" fill="#1d4ed8" text-anchor="middle">destino + quarentena</text>
  <text x="938" y="204" font-size="11.5" fill="#1e40af" text-anchor="middle">por dia e loja</text>
  <text x="938" y="221" font-size="11.5" fill="#1e40af" text-anchor="middle">contagem e valor</text>

  <rect x="1074" y="120" width="122" height="54" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="1135" y="142" font-size="13" font-weight="700" fill="#14532d" text-anchor="middle">fecha</text>
  <text x="1135" y="161" font-size="11" fill="#166534" text-anchor="middle">marca avanca</text>

  <rect x="1074" y="186" width="122" height="54" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="1135" y="208" font-size="13" font-weight="700" fill="#7f1d1d" text-anchor="middle">nao fecha</text>
  <text x="1135" y="227" font-size="11" fill="#991b1b" text-anchor="middle">codigo 1</text>

  <line x1="202" y1="175" x2="250" y2="175" stroke="#64748b" stroke-width="2" marker-end="url(#seta)"/>
  <text x="229" y="162" font-size="10.5" fill="#475569" text-anchor="middle">COPY</text>
  <text x="229" y="196" font-size="10.5" fill="#475569" text-anchor="middle">so-leitura</text>

  <line x1="408" y1="175" x2="442" y2="175" stroke="#64748b" stroke-width="2" marker-end="url(#seta)"/>
  <line x1="600" y1="175" x2="634" y2="175" stroke="#64748b" stroke-width="2" marker-end="url(#seta)"/>
  <line x1="792" y1="175" x2="832" y2="175" stroke="#64748b" stroke-width="2" marker-end="url(#seta)"/>
  <text x="814" y="163" font-size="10.5" fill="#475569" text-anchor="middle">estrela</text>

  <line x1="502" y1="222" x2="502" y2="280" stroke="#dc2626" stroke-width="2" marker-end="url(#setaVermelha)"/>
  <line x1="548" y1="286" x2="548" y2="228" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"
        marker-end="url(#setaClara)"/>
  <text x="614" y="246" font-size="11.5" fill="#b91c1c">reprovada</text>
  <text x="614" y="266" font-size="11.5" fill="#64748b">relida a cada carga</text>

  <path d="M 113 208 V 430 H 938 V 250" fill="none" stroke="#94a3b8" stroke-width="2"
        stroke-dasharray="5 4" marker-end="url(#setaClara)"/>
  <text x="420" y="423" font-size="11.5" fill="#64748b">a origem e reagregada; so o resumo por dia e loja viaja pela rede</text>

  <path d="M 600 328 H 880 V 250" fill="none" stroke="#94a3b8" stroke-width="2"
        stroke-dasharray="5 4" marker-end="url(#setaClara)"/>
  <text x="700" y="320" font-size="11.5" fill="#64748b">quarentena</text>

  <line x1="1038" y1="147" x2="1068" y2="147" stroke="#16a34a" stroke-width="2" marker-end="url(#setaVerde)"/>
  <line x1="1038" y1="213" x2="1068" y2="213" stroke="#dc2626" stroke-width="2" marker-end="url(#setaVermelha)"/>

  <text x="610" y="470" font-size="13" fill="#475569" text-anchor="middle">
    Toda linha da origem sai por uma de duas portas: vira fato ou vira quarentena. Nao existe terceira porta.
  </text>
</svg>
